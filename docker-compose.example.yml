# Minimal TLS deployment: Caddy terminates HTTPS (automatic Let's Encrypt)
# in front of the memory service. Replace memory.example.com with your domain.
#
# Usage:
#   docker compose -f docker-compose.example.yml up -d
#
# Then set MEMORY_API_KEY in the environment / .env file before starting
# (legacy AML_API_KEY is also accepted by the service).

services:
  memory:
    build: .
    restart: unless-stopped
    environment:
      MEMORY_DATA_DIR: /data
      MEMORY_API_KEY: ${MEMORY_API_KEY:-}
      MEMORY_SEARCH_MODE: ${MEMORY_SEARCH_MODE:-lexical}
    volumes:
      - memory-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - memory

volumes:
  memory-data:
  caddy-data:
  caddy-config:
