name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/**"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit and protocol tests
        run: python -m pytest tests/ -v

      - name: Run reliability battery
        run: python reliability_test.py

      - name: Run mechanism determinism tests
        run: |
          python usefulness_test.py --json > usefulness-results.json
          python poisoning_test.py

      - name: Preserve synthetic evaluation metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: usefulness-results.json
          if-no-files-found: warn

  mcp-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp==1.2.0", "mcp>=1.2,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install supported MCP version and tests
        env:
          MCP_REQUIREMENT: ${{ matrix.mcp }}
        run: python -m pip install -e ".[test]" "$MCP_REQUIREMENT"
      - name: Run storage and real stdio protocol tests
        run: python -m pytest tests/ -v
