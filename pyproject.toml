[project]
name = "memory-as-history"
version = "1.0.0"
description = "Agent memory as history: consolidation, anchors, provenance tiers, accountable forgetting, source criticism, narrative integration, canon circulation, and social framing — grounded in memory studies (Halbwachs, Nora, Assmann, Ricoeur). MCP Server for Claude Code / Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent-memory", "mcp", "llm", "memory", "context-engineering"]
authors = [{ name = "memory-as-history contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
memory-as-history = "memory_as_history.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_as_history"]
