[project]
name = "memory-as-history"
version = "1.3.0a1"
description = "Agent memory as history: traceable claims, evidence, revisions, scoped narratives and accountable forgetting. SQLite-backed MCP server inspired by history and memory studies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent-memory", "mcp", "llm", "memory", "context-engineering"]
authors = [{ name = "memory-as-history contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]
semantic = ["sentence-transformers>=5.7,<6"]

[project.scripts]
memory-as-history = "memory_as_history.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_as_history"]
